<circle cx="22" cy="20" r="6" fill="#ef4444"/><circle cx="42" cy="20" r="6" fill="#f59e0b"/><circle cx="62" cy="20" r="6" fill="#22c55e"/>
<text x="550" y="25" fill="#94a3b8" font-family="Menlo, monospace" font-size="13" text-anchor="middle">swift&#160;run&#160;CalendarClaimDemo&#160;&#8212;&#160;real&#160;output,&#160;abridged</text>
<text x="20" y="60" fill="#7dd3fc" font-family="Menlo, monospace" font-size="13">&#9472;&#9472;&#160;1.&#160;The&#160;failures&#160;date-math-bench&#160;reported,&#160;as&#160;answers</text>
<text x="20" y="84" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;Q:&#160;What&#160;is&#160;the&#160;date&#160;one&#160;month&#160;after&#160;March&#160;31,&#160;2025?</text>
<text x="20" y="108" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;A:&#160;One&#160;month&#160;after&#160;March&#160;31,&#160;2025&#160;is&#160;April&#160;31,&#160;2025.</text>
<text x="20" y="132" fill="#fca5a5" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;impossible&#160;date&#160;&#160;&#160;&#160;&#160;&#160;&#160;April&#160;31,&#160;2025</text>
<text x="20" y="156" fill="#cbd5e1" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#8594;&#160;April&#160;2025&#160;has&#160;30&#160;days</text>
<text x="20" y="180" fill="#fca5a5" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;contradicted&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;1&#160;month&#160;after&#160;March&#160;31,&#160;2025&#160;is&#160;April&#160;31,&#160;2025</text>
<text x="20" y="204" fill="#cbd5e1" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#8594;&#160;1&#160;month&#160;after&#160;March&#160;31,&#160;2025&#160;is&#160;Wednesday,&#160;April&#160;30,&#160;2025</text>
<text x="20" y="228" fill="#fca5a5" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;verdict:&#160;contradicted</text>
<text x="20" y="252" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;A:&#160;The&#160;day&#160;after&#160;Monday,&#160;July&#160;27,&#160;2026&#160;is&#160;July&#160;29,&#160;2026.</text>
<text x="20" y="276" fill="#fca5a5" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;contradicted&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;1&#160;day&#160;after&#160;July&#160;27,&#160;2026&#160;is&#160;July&#160;29,&#160;2026</text>
<text x="20" y="300" fill="#cbd5e1" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#8594;&#160;1&#160;day&#160;after&#160;July&#160;27,&#160;2026&#160;is&#160;Tuesday,&#160;July&#160;28,&#160;2026</text>
<text x="20" y="324" fill="#86efac" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;verified&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;July&#160;27,&#160;2026&#160;is&#160;a&#160;Monday</text>
<text x="20" y="348" fill="#fca5a5" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;verdict:&#160;contradicted</text>
<text x="20" y="372" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;Q:&#160;When&#160;is&#160;the&#160;third&#160;Tuesday&#160;of&#160;March&#160;2026?</text>
<text x="20" y="396" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;A:&#160;The&#160;third&#160;Tuesday&#160;of&#160;March&#160;2026&#160;is&#160;March&#160;16.</text>
<text x="20" y="420" fill="#fca5a5" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;contradicted&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;the&#160;third&#160;Tuesday&#160;of&#160;March&#160;2026&#160;is&#160;March&#160;16,&#160;2026</text>
<text x="20" y="444" fill="#cbd5e1" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#8594;&#160;the&#160;third&#160;Tuesday&#160;of&#160;March&#160;2026&#160;is&#160;March&#160;17,&#160;2026</text>
<text x="20" y="468" fill="#fca5a5" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;verdict:&#160;contradicted</text>
<text x="20" y="492" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;Q:&#160;How&#160;many&#160;business&#160;days&#160;are&#160;there&#160;between&#160;March&#160;2&#160;and&#160;March&#160;16,&#160;2026?</text>
<text x="20" y="516" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;A:&#160;There&#160;are&#160;14&#160;business&#160;days&#160;between&#160;Monday,&#160;March&#160;2,&#160;2026&#160;and&#160;Monday,&#160;March&#160;16,&#160;2026.</text>
<text x="20" y="540" fill="#86efac" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;verified&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;March&#160;2,&#160;2026&#160;is&#160;a&#160;Monday</text>
<text x="20" y="564" fill="#86efac" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;verified&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;March&#160;16,&#160;2026&#160;is&#160;a&#160;Monday</text>
<text x="20" y="588" fill="#fca5a5" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;contradicted&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;March&#160;2,&#160;2026&#160;to&#160;March&#160;16,&#160;2026&#160;is&#160;14&#160;business&#160;days</text>
<text x="20" y="612" fill="#cbd5e1" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#8594;&#160;March&#160;2,&#160;2026&#160;to&#160;March&#160;16,&#160;2026&#160;is&#160;10&#160;business&#160;days&#160;(11&#160;counting&#160;both&#160;ends)</text>
<text x="20" y="636" fill="#fca5a5" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;verdict:&#160;contradicted</text>
<text x="20" y="660" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13"></text>
<text x="20" y="684" fill="#7dd3fc" font-family="Menlo, monospace" font-size="13">&#9472;&#9472;&#160;5.&#160;Answers&#160;that&#160;only&#160;make&#160;sense&#160;with&#160;the&#160;question</text>
<text x="20" y="708" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;Q:&#160;What&#160;day&#160;of&#160;the&#160;week&#160;was&#160;July&#160;4,&#160;1976?</text>
<text x="20" y="732" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;A:&#160;It&#160;was&#160;a&#160;Sunday.</text>
<text x="20" y="756" fill="#86efac" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;verified&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;July&#160;4,&#160;1976&#160;is&#160;a&#160;Sunday&#160;(answer&#160;to&#160;the&#160;question)</text>
<text x="20" y="780" fill="#86efac" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;verdict:&#160;verified</text>
<text x="20" y="804" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;Q:&#160;What&#160;date&#160;is&#160;90&#160;days&#160;after&#160;March&#160;3,&#160;2026?</text>
<text x="20" y="828" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;A:&#160;Counting&#160;from&#160;March&#160;3:&#160;28&#160;days&#160;to&#160;March&#160;31,&#160;30&#160;more&#160;to&#160;April&#160;30,&#160;31&#160;more&#160;to&#160;May&#160;31,&#160;and&#160;1&#160;more&#160;lands&#160;on&#160;June&#160;1,&#160;2026.</text>
<text x="20" y="852" fill="#86efac" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;verified&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;90&#160;days&#160;after&#160;March&#160;3,&#160;2026&#160;is&#160;June&#160;1,&#160;2026&#160;(answer&#160;to&#160;the&#160;question)</text>
<text x="20" y="876" fill="#86efac" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;verdict:&#160;verified</text>
<text x="20" y="900" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13"></text>
<text x="20" y="924" fill="#fca5a5" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;verdict:&#160;contradicted</text>
<text x="20" y="948" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;note:&#160;Calendar&#160;check:&#160;90&#160;days&#160;after&#160;March&#160;3,&#160;2026&#160;is&#160;Monday,&#160;June&#160;1,&#160;2026&#160;(the&#160;answer&#160;said&#160;June&#160;2,&#160;2026).</text>
<text x="20" y="972" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;feedback:</text>
<text x="20" y="996" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;|&#160;Some&#160;calendar&#160;facts&#160;in&#160;your&#160;answer&#160;are&#160;wrong.&#160;These&#160;values&#160;were&#160;computed&#160;on&#160;the&#160;Gregorian&#160;calendar:</text>
<text x="20" y="1020" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;|&#160;-&#160;90&#160;days&#160;after&#160;March&#160;3,&#160;2026&#160;is&#160;Monday,&#160;June&#160;1,&#160;2026</text>
<text x="20" y="1044" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;|&#160;Correct&#160;the&#160;answer&#160;with&#160;these&#160;values&#160;and&#160;keep&#160;everything&#160;else.</text>
</svg>
