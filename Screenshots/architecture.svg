<text x="720.0" y="190" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">month&#160;length,&#160;today</text>
<rect x="610" y="250" width="220" height="130" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="720.0" y="274" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">QuestionReader</text>
<text x="720.0" y="296" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">question&#160;asks,&#160;answer&#160;gives:</text>
<text x="720.0" y="314" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">&#34;What&#160;day&#160;was&#160;July&#160;4,&#160;1976?&#34;</text>
<text x="720.0" y="332" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">&#34;A&#160;Sunday.&#34;&#160;&#8594;&#160;one&#160;claim</text>
<text x="720.0" y="350" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">worked&#160;answers:&#160;last&#160;result</text>
<rect x="880" y="90" width="195" height="170" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
<text x="977.5" y="114" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">CalendarEvaluator</text>
<text x="977.5" y="136" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">CivilDate&#160;day&#160;counts</text>
