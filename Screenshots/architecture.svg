<text x="977.5" y="172" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">BusinessCalendar</text>
<text x="977.5" y="190" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">weekend&#160;+&#160;holidays</text>
<text x="977.5" y="208" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">months&#160;clamp:&#160;Mar&#160;31</text>
<text x="977.5" y="226" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">+&#160;1&#160;month&#160;=&#160;Apr&#160;30</text>
<rect x="880" y="300" width="195" height="150" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="977.5" y="324" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">CalendarReport</text>
<text x="977.5" y="346" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">verified&#160;/&#160;contradicted&#160;/</text>
<text x="977.5" y="364" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">impossible&#160;date&#160;/</text>
<text x="977.5" y="382" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">depends&#160;on&#160;convention&#160;/</text>
<text x="977.5" y="400" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">unresolved</text>
<text x="977.5" y="418" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">note&#160;&#183;&#160;feedback</text>
<rect x="320" y="420" width="510" height="120" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
<text x="575.0" y="444" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">CalendarSession&#160;(actor)</text>
<text x="575.0" y="466" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">carries&#160;the&#160;year&#160;a&#160;conversation&#160;set&#160;(&#34;the&#160;2027&#160;offsite&#34;)&#160;into&#160;later&#160;turns</text>
<text x="575.0" y="484" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">totals:&#160;checks,&#160;verified,&#160;contradicted,&#160;impossible,&#160;convention,&#160;unresolved</text>
<text x="575.0" y="502" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">a&#160;guessed&#160;year&#160;that&#160;fails&#160;is&#160;retried&#160;as&#160;next&#160;and&#160;last&#160;year&#160;&#8594;&#160;&#34;depends&#160;on&#160;convention&#34;</text>
