<text x="145.0" y="136" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">sends&#160;the&#160;turn</text>
<text x="145.0" y="154" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">returns&#160;the&#160;answer&#160;text</text>
<rect x="30" y="220" width="230" height="96" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
<text x="145.0" y="244" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">question&#160;+&#160;answer</text>
<text x="145.0" y="266" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">&#34;What&#160;date&#160;is&#160;90&#160;days&#160;after</text>
<text x="145.0" y="284" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">March&#160;3,&#160;2026?&#34;&#160;/&#160;&#34;June&#160;2&#34;</text>
<rect x="320" y="90" width="230" height="130" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="435.0" y="114" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Tokenizer&#160;+&#160;PieceScanner</text>
<text x="435.0" y="136" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">&#34;Tue,&#160;17&#160;Mar&#160;2026&#34;&#160;=&#160;one&#160;date</text>
<text x="435.0" y="154" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">numbers,&#160;units,&#160;ordinals,</text>
<text x="435.0" y="172" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">&#34;today&#34;,&#160;&#34;next&#160;Friday&#34;</text>
<text x="435.0" y="190" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">&#34;May&#34;&#160;only&#160;when&#160;capitalised</text>
<rect x="320" y="250" width="230" height="130" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="435.0" y="274" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">PieceReader</text>
<text x="435.0" y="296" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">a&#160;year&#160;for&#160;every&#160;date:</text>
<text x="435.0" y="314" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">same&#160;sentence&#160;&#8594;&#160;text&#160;&#8594;</text>
<text x="435.0" y="332" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">conversation&#160;&#8594;&#160;today</text>
<text x="435.0" y="350" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">(the&#160;source&#160;is&#160;kept)</text>
<rect x="610" y="90" width="220" height="130" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="720.0" y="114" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ClaimReader</text>
<text x="720.0" y="136" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">answer&#160;states&#160;both&#160;sides:</text>
<text x="720.0" y="154" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">weekday,&#160;offset,&#160;span,</text>
