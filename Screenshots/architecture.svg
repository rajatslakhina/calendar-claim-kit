<text x="550" y="60" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">the&#160;calendar&#160;arithmetic&#160;in&#160;an&#160;answer,&#160;recomputed&#160;instead&#160;of&#160;trusted</text>
<rect x="30" y="90" width="230" height="96" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
